name: Android build

on:
  pull_request:
    paths:
      - "android/**"
      - "config/detekt/**"
      - ".editorconfig"
      - "scripts/build-android.sh"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "config/detekt/**"
      - ".editorconfig"
      - "scripts/build-android.sh"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "9.4.1"

      - name: Generate project Gradle wrapper for this CI run
        run: gradle -p android wrapper --gradle-version 9.4.1 --distribution-type bin

      - name: Check Kotlin style
        run: ./android/gradlew -p android :app:ktlintCheck --stacktrace --console=plain 2>&1 | tee ktlint-check.log

      - name: Run Detekt
        run: ./android/gradlew -p android :app:detekt --stacktrace --console=plain 2>&1 | tee detekt.log

      - name: Assemble mock debug APK
        run: ./android/gradlew -p android :app:assembleMockDebug --stacktrace --console=plain 2>&1 | tee assemble-mock.log

      - name: Run mock-flavor unit tests
        run: ./android/gradlew -p android testMockDebugUnitTest --stacktrace --console=plain 2>&1 | tee mock-unit-tests.log

      - name: Upload Android diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-diagnostics-${{ github.run_id }}
          path: |
            ktlint-check.log
            detekt.log
            assemble-mock.log
            mock-unit-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish mock APK
        uses: actions/upload-artifact@v6
        with:
          name: lazaynova-android-mock-debug
          path: android/app/build/outputs/apk/mock/debug/*.apk
          if-no-files-found: error
          retention-days: 7
